
<style>
    :root {
  --youtube-red: rgb(255, 0, 0);
  --twitter-blue: rgb(6, 126, 224);
  --join-blue: rgb(3, 94, 221);
}
body {
    font-family: Arial, sans-serif;
}

button {
    font-family: inherit;
    cursor: pointer;
    user-select: none;
    min-height: 40px;

    transition:
        background-color 0.15s,
        color 0.15s,
        box-shadow 0.15s,
        transform 0.1s;

    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
}

button:hover {
    transform: translateY(-2px);
}

button:active {
    transform: scale(0.98);
}

button:focus {
    outline: 2px solid rgba(0,0,0,0.3);
    outline-offset: 2px;
}
    .subscribe-button {
        color : white;
        background-color: var(--youtube-red);
        border: none;
        padding: 10px 16px;
        border-radius: 2px;
        margin-right: 8px;
        transition: all 0.15s;
        vertical-align: top;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    }
    .subscribe-button:hover {
        opacity: 0.8;
            background-color: var(--youtube-red);
            cursor: pointer;
    }
    .subscribe-button:active {
            transform: translateY(1px);
            box-shadow: none;
}
    .join-button {
        background-color: white;
        border: 1px solid var(--join-blue);
        padding: 10px 16px;
        color: var(--join-blue);
        padding: 10px 16px;
        border-radius: 2px;
        cursor: pointer;
        transition: all 0.15s;
        color : var(--join-blue);
        vertical-align: top;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);

    }
    .join-button:hover {
        color: white;
        background-color: var(--join-blue);
    }
    .join-button:active {
        opacity: 0.5;
        transform: translateY(1px);
        box-shadow: none;
    }

    .tweet-button {
        background-color: var(--twitter-blue);
        color: white;
        border: none;
        font-weight: bold;
        padding: 10px 16px;
        font-size: 15px;
        border-radius: 35px;
        cursor: pointer;
        margin-left: 8px;
        transition: all 0.15s;
        vertical-align: top;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    }
    .tweet-button:hover{
    box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.2);
    }
    .tweet-button:active {
        opacity: 0.5;
        transform: translateY(1px);
        box-shadow: none;
    }
.button-container {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 12px;
    padding: 20px;
    background-color: #f9f9f9;
    border-radius: 8px;
  }
    /* Removed default border and added custom padding for a modern look */
.subscribe-button:hover {
  background-color: var(--youtube-red);
  cursor: pointer;
}
.join-button:hover {
  background-color: var(--join-blue);
  color: white;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
  cursor: pointer;
}

.tweet-button:hover {
  opacity: 0.8;
  cursor: pointer;
}
@media (max-width: 600px) {
    .button-container {
        flex-direction: column;
        align-items: stretch;
    }

    button {
        width: 100%;
    }
}
</style>
<button class="subscribe-button">
    SUBSCRIBE
</button>
<button class="join-button">
    JOIN
</button>
<button class="tweet-button">
    Tweet
</button>
