<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>youtube</title>
    <style>
        .thumbnails2 {
            width: 300px;
            border-radius: 10px;
        }
        .thumb {
           width: 100px;
           height: 100px;
           object-fit: cover;
           margin-left: 100px;
           border-radius: 10px;

        }
        .thumbcatch {
            width: 100px;
            height: 100px;
            object-fit: cover;
            margin-left: 100px;
            border-radius: 50%;
        }
        .searchbar {

            font-size: 15px;
            width: 200px;
            height: 30px;
            border: 1px solid black;
            border-radius: 3px;
            padding-left: 10px;
        }
        .searchbar2 {
            font-size: 15px;
            width: 200px;
            height: 30px;
            border: 1px solid black;
            border-radius: 3px;
            padding-left: 10px;
            box-shadow: gray 0 1px 2px;
            transition: all 0.15s;
            .searchbar2:hover {
                box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            }
        }
         .searchbar2:focus {
             outline: none;
             border-color: #065fd4;
             box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
         }
         .searchbar2::placeholder {
             color: #888;
             font-family: Arial, sans-serif;
         }
    </style>
</head>
<body>
<img src="hq720.avif" class="thumbnails2">
<img src="hq720.avif" class="thumb">
<img src="hq720.avif" class="thumbcatch">
<input type="text" placeholder="Search..." class="searchbar">
<input type="text" placeholder="Search..." class="searchbar2">
</body>
</html>
